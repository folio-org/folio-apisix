version: "3.8"

services:

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: apisix-etcd
    restart: always
    volumes:
      - etcd_data:/etcd-data
    environment:
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      apisix-net:

  apisix:
    build: .
    container_name: apisix-gateway
    restart: always
    environment:
      APISIX_NODE_LISTEN: ${APISIX_NODE_LISTEN:-9080}
      APISIX_ADMIN_API_PORT: ${APISIX_ADMIN_API_PORT:-9180}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
      APISIX_VIEWER_KEY: ${APISIX_VIEWER_KEY:-4054f7cf07e344346cd3f287985e76a2}
      # Space-separated regex patterns for allowed CORS origins (allow_origins_by_regex).
      # Unset or "*" means any origin (".*"), e.g. "^https://.*\.folio\.org$ ^https://app\.demo\.org$"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Exact origins for allow_origins (comma-separated or ** to allow all forcefully).
      # ** is the default and allows credentials from any origin — see README security warning.
      CORS_ALLOW_ORIGINS_EXACT: ${CORS_ALLOW_ORIGINS_EXACT:-**}
      # Headers allowed in CORS requests (** = allow all forcefully, default — see README security warning).
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-**}
      # Whether to allow client credentials in CORS responses (default: true).
      CORS_ALLOW_CREDENTIAL: ${CORS_ALLOW_CREDENTIAL:-true}
    depends_on:
      - etcd
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      apisix-net:

  # Test echo service
  echo:
    image: mendhak/http-https-echo:31
    container_name: apisix-echo
    environment:
      HTTP_PORT: 8080
    networks:
      apisix-net:

volumes:
  etcd_data:

networks:
  apisix-net:
    driver: bridge
